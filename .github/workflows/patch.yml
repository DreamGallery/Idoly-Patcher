name: Patch game APKs
on:
  workflow_dispatch:
    inputs:
      module_tag:
        description: 插件发布版本（留空自动选最新正式插件，如 v0.2.1）
        type: string
        required: false
      allow_untested_version:
        description: 允许修补尚未验证兼容性的游戏版本
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: patch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IDOLY_KS_PASS: ${{ secrets.PATCH_KEYSTORE_PASSWORD }}
      IDOLY_KEY_PASS: ${{ secrets.PATCH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.0' 'platform-tools'
      - name: Test packager
        run: python -m unittest discover -s tests -v
      - name: Prepare private inputs
        env:
          GAME_APKS_URL: ${{ secrets.GAME_APKS_URL }}
          PATCH_KEYSTORE_BASE64: ${{ secrets.PATCH_KEYSTORE_BASE64 }}
        run: python ci_prepare.py
      - name: Patch and verify
        env:
          MODULE_TAG: ${{ inputs.module_tag }}
          ALLOW_UNTESTED: ${{ inputs.allow_untested_version }}
          KEY_ALIAS: ${{ vars.PATCH_KEY_ALIAS || 'idoly-patcher' }}
        run: |
          options=(--key-alias "$KEY_ALIAS")
          if [[ -n "$MODULE_TAG" ]]; then options+=(--module-tag "$MODULE_TAG"); fi
          if [[ "$ALLOW_UNTESTED" == 'true' ]]; then options+=(--allow-untested-version); fi
          python patcher.py patch "${options[@]}"
      - name: Downloadable APK set
        uses: actions/upload-artifact@v4
        with:
          name: idoly-patched-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 1
      - name: Remove private inputs
        if: always()
        run: rm -rf secrets inputs cache output
